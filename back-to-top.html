<button type="button" id="btn-back-to-top" aria-label="Back to top" title="Back to top">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M12 19V5"></path>
    <path d="m5 12 7-7 7 7"></path>
  </svg>
</button>

<script>
document.addEventListener("DOMContentLoaded", function () {
  function labelColorSchemeToggle() {
    var colorSchemeToggle = document.querySelector(".quarto-color-scheme-toggle");
    if (colorSchemeToggle) {
      colorSchemeToggle.setAttribute("aria-label", "Toggle color scheme");
      colorSchemeToggle.setAttribute("title", "Toggle color scheme");
    }
  }
  window.setTimeout(labelColorSchemeToggle, 0);

  var button = document.getElementById("btn-back-to-top");
  if (!button) return;

  function updateVisibility() {
    button.classList.toggle("is-visible", window.scrollY > 480);
  }

  button.addEventListener("click", function () {
    if (window.location.hash && window.history && window.history.replaceState) {
      window.history.replaceState(null, "", window.location.pathname + window.location.search);
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  updateVisibility();
  window.addEventListener("scroll", updateVisibility, { passive: true });
});
</script>
