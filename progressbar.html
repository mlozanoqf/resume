<div id="progress-bar" aria-hidden="true"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var bar = document.getElementById("progress-bar");
  var documentBody = document.getElementById("quarto-content");
  var html = document.documentElement;
  if (!bar || !documentBody) return;

  function updateProgress() {
    var height = documentBody.scrollHeight + documentBody.offsetTop;
    var scrollable = height - html.clientHeight;
    var percentage = scrollable > 0 ? (html.scrollTop / scrollable) * 100 : 0;
    bar.style.width = Math.min(100, Math.max(0, percentage)) + "%";
  }

  updateProgress();
  window.addEventListener("scroll", updateProgress, { passive: true });
  window.addEventListener("resize", updateProgress);
});
</script>
